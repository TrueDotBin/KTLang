name: Release KTLang CLI

on:
  push:
    tags: ["v*"]
  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid:
          - win-x64
          - linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore KTLang.slnx

      - name: Publish for ${{ matrix.rid }}
        run: >
          dotnet publish KTLang.Cli/KTLang.Cli.csproj
          --configuration Release
          --self-contained
          --runtime ${{ matrix.rid }}
          -p:PublishSingleFile=true
          -o publish

      - name: Package
        run: |
          cd publish
          zip -r ../KTLangCli-${{ matrix.rid }}.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KTLang Interpreter for ${{ matrix.rid }}
          path: KTLangCli-${{ matrix.rid }}.zip

  release:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true