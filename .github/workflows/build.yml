
name: Build KTLang CLI

on:
  push:
    branches: [main]
    
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore KTLang.slnx

      - name: Build
        run: dotnet build KTLang.Cli/KTLang.Cli.csproj --configuration Release --no-restore